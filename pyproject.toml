[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacognitive-signal"
version = "0.1.0"
description = "Reproduction code for factorial metacognitive-signal analyses in language models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.5,<4",
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
]

[project.urls]
Repository = "https://github.com/Yilong-Lu/Diagnosing_Correctness"

[project.optional-dependencies]
gpu = [
  "torch>=2.1",
  "tqdm>=4.65,<5",
  "transformers>=4.45,<5",
]
dev = [
  "pytest>=7.4,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
metacog-prepare = "metacog.cli.prepare:main"
metacog-extract = "metacog.cli.extract:main"
metacog-score-answer = "metacog.cli.score:main"
metacog-score-judgement = "metacog.cli.score_judgement:main"
metacog-analyze = "metacog.cli.analyze:main"
metacog-reproduce = "metacog.cli.reproduce:main"
metacog-summarize = "metacog.cli.summarize:main"
metacog-robustness = "metacog.cli.robustness:main"
metacog-audit = "metacog.cli.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
